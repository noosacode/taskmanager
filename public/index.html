<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <!-- Login -->
        <div id="login-box" class="card">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">

            <button id="login-btn" class="btn-primary">Login</button>
        </div>

        <!-- Main navigation -->
        <div id="nav-area" style="display: none;">

            <a href="html/projects.html" class="nav-btn">Projects</a>
            <a href="html/priority-tasks.html" class="nav-btn">Priority Tasks</a>
            <a href="html/categories.html" class="nav-btn">Categories</a>
            <a href="html/containers.html" class="nav-btn">Containers</a>
            <a href="html/completed.html" class="nav-btn">Completed</a>

            <button id="logout-btn" class="btn-secondary">
                Logout
            </button>

        </div>

    </div>

    <script>
        if (localStorage.getItem("token")) {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("nav-area").style.display = "block";
        }
    </script>

    <script src="js/login.js"></script>
    <script src="js/logout.js"></script>

</body>

</html>
