<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1 class="app-title">TaskManager</h1>

        <!-- Login Box -->
        <div id="login-box" class="card">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">

            <button id="login-btn" class="btn-primary">Login</button>

        </div>

        <!-- Navigation Buttons (hidden until login) -->
        <div id="nav-area" style="display: none;">
            <button id="logout-btn" class="btn-secondary" style="display: none;">
                Logout
            </button>
            
            <a href="html/projects.html" class="nav-btn">Projects</a>
            <a href="html/progress.html" class="nav-btn">Progress</a>
            <a href="html/categories.html" class="nav-btn">Categories</a>
            <a href="html/completion.html" class="nav-btn">Completion Log</a>

        </div>

    </div>

    <script>
        if (localStorage.getItem("token")) {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("nav-area").style.display = "block";
        }
    </script>

    <script src="js/login.js"></script>
    <script src="js/logout.js"></script>

</body>

</html>
